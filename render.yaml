# Blueprint opcional do Render (plano gratuito) — use apenas quando for integrar os canais.
# Limitações do plano free: hiberna após ~15 min sem tráfego e o disco é efêmero (SQLite reinicia).
services:
  - type: web
    name: gestor-de-automacoes
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TENANT_ID
        value: clinica
      - key: DB_PATH
        value: /app/data/bot.db
      - key: INTEGRATION_ALLOWED_HOSTS
        value: script.google.com,script.googleusercontent.com
      - key: TRUST_PROXY          # Render fica atrás de proxy: IP real vem de X-Forwarded-For
        value: "1"
      - key: WEBCHAT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY  # disco do plano free é efêmero; a chave protege volumes persistentes
        generateValue: true
