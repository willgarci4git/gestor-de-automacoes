<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console do Atendente</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e3e6eb; --acc:#1f6feb; --warn:#b45309; --ok:#15803d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --panel:#171a21; --ink:#e7e9ee; --muted:#9aa3b2; --line:#2a303c; --acc:#2f81f7; --warn:#f59e0b; --ok:#22c55e; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:8px; align-items:center; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header b { margin-right:auto; }
  input, button, select { font:inherit; padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  button { cursor:pointer; } button.primary { background:var(--acc); color:#fff; border:0; }
  main { display:grid; grid-template-columns: 320px 1fr; height:calc(100dvh - 58px); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; height:auto; } }
  #list { border-right:1px solid var(--line); overflow-y:auto; background:var(--panel); }
  .t { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .t.sel { background:var(--bg); } .t small { color:var(--muted); display:block; }
  .badge { font-size:12px; font-weight:600; } .waiting { color:var(--warn); } .active { color:var(--ok); } .closed { color:var(--muted); }
  #detail { display:flex; flex-direction:column; min-height:60vh; }
  #ctx { padding:12px 16px; border-bottom:1px solid var(--line); color:var(--muted); font-size:13px; white-space:pre-wrap; }
  #tr { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:6px; }
  .e { max-width:80%; padding:8px 11px; border-radius:12px; white-space:pre-wrap; }
  .user { background:var(--panel); border:1px solid var(--line); align-self:flex-start; }
  .agent { background:var(--acc); color:#fff; align-self:flex-end; }
  .system { align-self:center; color:var(--muted); font-size:12px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); background:var(--panel); }
  form input { flex:1; }
</style>
</head>
<body>
<header>
  <b>Console do Atendente</b>
  <input id="token" placeholder="ADMIN_TOKEN" type="password" aria-label="Token">
  <input id="agent" placeholder="Seu nome" aria-label="Nome do atendente">
  <select id="status"><option value="">Abertos</option><option value="waiting">Aguardando</option><option value="active">Em atendimento</option><option value="closed">Encerrados</option></select>
  <button id="connect" class="primary">Conectar</button>
</header>
<main>
  <div id="list"></div>
  <div id="detail">
    <div id="ctx">Selecione um ticket.</div>
    <div id="tr"></div>
    <form id="f"><input id="msg" placeholder="Responder ao cliente..." autocomplete="off"><button class="primary">Enviar</button><button type="button" id="accept">Assumir</button><button type="button" id="close">Encerrar</button></form>
  </div>
</main>
<script>
  const $ = id => document.getElementById(id);
  const store = { get(k){ try { return localStorage.getItem(k) || ''; } catch { return ''; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
  $('token').value = store.get('ag_token'); $('agent').value = store.get('ag_name') || 'Atendente';
  let tickets = [], selected = null, es = null;
  const headers = () => ({ 'content-type':'application/json', 'x-admin-token': $('token').value });

  async function load() {
    const st = $('status').value;
    const r = await fetch('/handoff/tickets' + (st ? '?status=' + st : ''), { headers: headers() });
    if (!r.ok) { $('list').textContent = 'Erro ' + r.status + ' (token?)'; return; }
    tickets = (await r.json()).filter(t => st || t.status !== 'closed').reverse();
    renderList(); renderDetail();
  }
  function renderList() {
    $('list').innerHTML = '';
    tickets.forEach(t => {
      const d = document.createElement('div'); d.className = 't' + (t.id === selected ? ' sel' : '');
      const name = t.context['contact.full_name'] || t.address.userId;
      d.innerHTML = `<span class="badge ${t.status}"></span> <b></b><small></small>`;
      d.querySelector('.badge').textContent = t.status; d.querySelector('b').textContent = name;
      d.querySelector('small').textContent = `${t.queue} · ${t.address.channel} · ${new Date(t.createdAt).toLocaleString()}`;
      d.onclick = () => { selected = t.id; renderList(); renderDetail(); }; $('list').appendChild(d);
    });
  }
  function renderDetail() {
    const t = tickets.find(x => x.id === selected); $('tr').innerHTML = '';
    if (!t) { $('ctx').textContent = 'Selecione um ticket.'; return; }
    $('ctx').textContent = 'Contexto do bot:\n' + JSON.stringify(t.context, null, 2);
    t.transcript.forEach(e => { const d = document.createElement('div'); d.className = 'e ' + e.from; d.textContent = e.text; $('tr').appendChild(d); });
    $('tr').scrollTop = $('tr').scrollHeight;
  }
  async function act(path, body) {
    if (!selected) return;
    const r = await fetch(`/handoff/tickets/${selected}/${path}`, { method:'POST', headers: headers(), body: JSON.stringify(body || {}) });
    if (!r.ok) alert('Falha: ' + (await r.text()));
    load();
  }
  $('f').onsubmit = e => { e.preventDefault(); const text = $('msg').value.trim(); if (!text) return; $('msg').value = ''; act('reply', { text, agent: $('agent').value }); };
  $('accept').onclick = () => act('accept', { agent: $('agent').value });
  $('close').onclick = () => act('close');
  $('status').onchange = load;
  $('connect').onclick = () => {
    store.set('ag_token', $('token').value); store.set('ag_name', $('agent').value);
    if (es) es.close();
    es = new EventSource('/handoff/stream?token=' + encodeURIComponent($('token').value));
    es.addEventListener('ticket', load);
    load();
  };
  $('connect').click();
</script>
</body>
</html>
