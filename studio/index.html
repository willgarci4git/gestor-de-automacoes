<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor de Automações · Studio</title>
<meta name="description" content="Editor, simulador e diagnóstico de fluxos de atendimento — roda 100% no navegador.">

<body>
